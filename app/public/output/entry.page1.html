<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{name}}</title>
  <link rel="stylesheet" href="/static/normalize.css">
  <link rel="icon" type="image/x-icon" href="/static/logo.png">
</head>

<body>
  <h1>page1<h1>
      <input id="env" value="{{env}}" style="display: none;">
      <input id="options" value="{{options}}" style="display: none;">
      <button onclick="getProjectList()">获取项目列表</button>
      <script src="https://cdn.bootcss.com/axios/0.18.0/axios.min.js"></script>
      <script type="text/javascript">
        try {
          window.env = document.querySelector("#env").value
          window.options = JSON.parse(document.querySelector("#options").value)

        } catch (error) {
          console.error("解析环境变量或选项失败", error)
        }
        function getProjectList() {
          axios.get("/api/project/list")
            .then(res => {
              console.log(res.data)
            })
            .catch(err => {
              console.error("获取项目列表失败", err)
            })
        }
      </script>
</body>

</html>
